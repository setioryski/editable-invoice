<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv='Content-Type' content='text/html; charset=UTF-8' />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="dynamic-title">Invoice</title>
    
    <!-- jQuery Library -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    
    <!-- CSS Styles -->
    <style>
        /* style.css */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font: 14px/1.4 Georgia, serif; }
        #page-wrap { width: 800px; margin: 0 auto; }

        .controls { padding: 10px 0; }
        .controls button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            margin: 10px 5px 10px 0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .controls button:hover { background-color: #45a049; }

        textarea { border: 0; font: 14px Georgia, Serif; overflow: hidden; resize: none; background-color: transparent; }
        table { border-collapse: collapse; width: 100%;}
        table td, table th { border: 1px solid black; padding: 5px; }

        #header { 
            width: 100%; 
            margin: 20px 0; 
            background: #222; 
            text-align: center; 
            color: white; 
            font: bold 15px Helvetica, Sans-Serif; 
            text-decoration: uppercase; 
            letter-spacing: 20px; 
            padding: 8px 0px; 
        }

        #address { width: 250px; height: 150px; float: left; }
        #customer { overflow: hidden; }

        #logo { text-align: right; float: right; position: relative; margin-top: 25px; border: 1px solid #fff; max-width: 540px; max-height: 100px; overflow: hidden; }
        #logo:hover, #logo.edit { border: 1px solid #000; margin-top: 0px; max-height: 125px; }
        #logoctr { display: none; }
        #logo:hover #logoctr, #logo.edit #logoctr { display: block; text-align: right; line-height: 25px; background: #eee; padding: 0 5px; }
        #logohelp { text-align: left; display: none; font-style: italic; padding: 10px 5px;}
        #logohelp input { margin-bottom: 5px; }
        .edit #logohelp { display: block; }
        .edit #save-logo, .edit #cancel-logo { display: inline; }
        .edit #image, #save-logo, #cancel-logo, .edit #change-logo, .edit #delete-logo { display: none; }
        #customer-title { font-size: 20px; font-weight: bold; float: left; }

        #meta { margin-top: 1px; width: 300px; float: right; }
        #meta td { text-align: right;  }
        #meta td.meta-head { text-align: left; background: #eee; }
        #meta td textarea { width: 100%; height: 20px; text-align: right; }

        #items { clear: both; width: 100%; margin: 30px 0 0 0; border: 1px solid black; }
        #items th { background: #eee; }
        #items textarea { width: 100%; height: 100%; box-sizing: border-box; }
        /* FIX: Changed vertical-align to top for consistent alignment */
        #items tr.item-row td { 
            border: 0; 
            vertical-align: top; 
            padding-top: 10px;
            padding-bottom: 10px;
        }
        #items td.description { width: 300px; }
        #items td.item-name { width: 175px; }
        #items td.total-line { border-right: 0; text-align: right; }
        #items td.total-value { border-left: 0; padding: 10px; }
        #items td.total-value textarea { height: 20px; background: none; }
        #items td.balance { background: #eee; }
        #items td.blank { border: 0; }

        /* FIXED: Added text-align right for numeric columns */
        #items th.text-right, #items td.text-right { text-align: right; }
        #items td.text-right textarea, #items td.text-right input { text-align: right; }
        
        /* FIX: Consistent styling for inputs to match textareas */
        #items input {
            border: 0;
            font: 14px Georgia, Serif;
            background-color: transparent;
        }
        #items input:focus {
            outline: none;
        }


        #terms { text-align: center; margin: 20px 0 0 0; }
        #terms h5 { text-transform: uppercase; font: 13px Helvetica, Sans-Serif; letter-spacing: 10px; border-bottom: 1px solid black; padding: 0 0 8px 0; margin: 0 0 8px 0; }
        #terms textarea { width: 100%; text-align: center;}

        textarea:hover, textarea:focus, #items input:hover, #items input:focus, #items td.total-value textarea:hover, #items td.total-value textarea:focus, .delete:hover { background-color:#EEFF88; }

        .delete-wpr { 
            position: relative; 
            display: flex;
            /* FIX: Align flex items by their text baseline for perfect alignment */
            align-items: baseline;
        }
        .delete-wpr .order-number {
            padding-right: 5px;
            white-space: nowrap;
        }
        .delete-wpr textarea {
            flex-grow: 1;
            width: auto;
        }
        .delete { 
            display: block; 
            color: #000; 
            text-decoration: none; 
            position: absolute; 
            background: #EEEEEE; 
            font-weight: bold; 
            padding: 0px 3px; 
            border: 1px solid; 
            top: 50%;
            transform: translateY(-50%);
            left: -22px; 
            font-family: Verdana; 
            font-size: 12px; 
        }
        
        .description-area { margin-bottom: 5px; font-style: italic; color: #555; }
        /* NEW: Style for when the description area is clickable */
        .description-area.editable {
            cursor: pointer;
            color: #000; /* FIX: Changed color to black */
        }


        /* NEW: Modal Styles */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: #fefefe; margin: 10% auto; padding: 20px; border: 1px solid #888; width: 60%; border-radius: 5px; }
        .close-button { color: #aaa; float: right; font-size: 28px; font-weight: bold; }
        .close-button:hover, .close-button:focus { color: black; text-decoration: none; cursor: pointer; }
        #invoice-list { list-style-type: none; padding: 0; }
        #invoice-list li { padding: 12px; border-bottom: 1px solid #ddd; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        #invoice-list li:hover { background-color: #f1f1f1; }
        #invoice-list li .customer { font-weight: bold; }


        /* print.css */
        @media print {
            .no-print, #hiderow, .delete, #logoctr, #logohelp { 
                display: none; 
            }
            
            /* Make form elements look like plain text for printing */
            textarea, input {
                border: none !important;
                box-shadow: none !important;
                background-color: transparent !important;
                -webkit-appearance: none;
                -moz-appearance: none;
                appearance: none;
                resize: none;
            }
        }
    </style>
</head>
<body>

    <div id="page-wrap">
        <div class="controls no-print">
            <button onclick="saveInvoices()">Save to Database</button>
            <button onclick="loadInvoiceWithPrompt()">Load by ID</button>
            <button onclick="showHistory()">View History</button>
            <button onclick="window.print()">Print Invoice</button>
            <button onclick="sessionStorage.removeItem('loggedIn'); window.location.href='login.html'">Logout</button>
        </div>

        <textarea id="header">INVOICE</textarea>
        
        <div id="identity">
            <textarea id="address">Jalan Lintas Sumatera no.3
Simpang Kuala Tanjung
Batubara Sumatera Utara 21257
Phone: 0822 5510-0105</textarea>

            <div id="logo">
              <div id="logoctr">
                <a href="javascript:;" id="change-logo" class="no-print">Change Logo</a>
                <a href="javascript:;" id="save-logo" class="no-print">Save</a> |
                <a href="javascript:;" id="delete-logo" class="no-print">Delete Logo</a>
                <a href="javascript:;" id="cancel-logo" class="no-print">Cancel</a>
              </div>
              <div id="logohelp" class="no-print">
                <input id="imageloc" type="text" size="50" value="" /><br />
                (max width: 540px, max height: 100px)
              </div>
              <img id="image" src="images/logo.png" alt="logo" />
            </div>
        </div>
        
        <div style="clear:both"></div>
        
        <div id="customer">
            <textarea id="customer-title">Widget Corp. c/o Steve Widget</textarea>
            <table id="meta">
                <tr>
                    <td class="meta-head">Date</td>
                    <td><textarea id="date">December 15, 2023</textarea></td>
                </tr>
            </table>
        </div>
        
        <div class="no-print" style="margin: 20px 0;">
            <label for="roomType">Select Room Type to Add:</label>
            <select id="roomType">
                <option value="standard">Standard Room</option>
                <option value="standard_extrabed">Standard Room + Extra Bed</option>
                <option value="deluxe">Deluxe Room</option>
                <option value="deluxe_extrabed">Deluxe Room + Extra Bed</option>
            </select>
        </div>

        <table id="items">
          <thead>
              <tr>
                  <th>Item</th>
                  <th>Description (Check-in / Check-out)</th>
                  <th class="text-right">Unit Cost</th>
                  <th class="text-right">Quantity</th>
                  <th class="text-right">Price</th>
              </tr>
          </thead>
          <tbody>
              <tr class="item-row">
                  <td class="item-name"><div class="delete-wpr"><span class="order-number"></span><textarea>Room 101</textarea><a class="delete" href="javascript:;" title="Remove row">X</a></div></td>
                  <td class="description">
                      <div class="description-area">Select dates below</div>
                      <!-- NEW: Wrapper for date pickers -->
                      <div class="date-pickers">
                          <input type="date" class="checkin" style="width: 48%;">
                          <input type="date" class="checkout" style="width: 48%;">
                      </div>
                  </td>
                  <td class="text-right"><textarea class="cost">300000</textarea></td>
                  <td class="text-right"><textarea class="qty">1</textarea></td>
                  <td class="text-right"><span class="price">300000.00</span></td>
              </tr>
              
              <tr id="hiderow">
                  <td colspan="5"><a id="addrow" href="javascript:;" title="Add a row" class="no-print">Add a row</a></td>
              </tr>
              
              <tr>
                  <td colspan="2" class="blank"> </td>
                  <td colspan="2" class="total-line">Subtotal</td>
                  <td class="total-value"><div id="subtotal">0.00</div></td>
              </tr>
              <tr>
                  <td colspan="2" class="blank"> </td>
                  <td colspan="2" class="total-line">Total</td>
                  <td class="total-value"><div id="total">0.00</div></td>
              </tr>
              <tr>
                  <td colspan="2" class="blank"> </td>
                  <td colspan="2" class="total-line">Amount Paid</td>
                  <td class="total-value"><textarea id="paid">0.00</textarea></td>
              </tr>
              <tr>
                  <td colspan="2" class="blank"> </td>
                  <td colspan="2" class="total-line balance">Balance Due</td>
                  <td class="total-value balance"><div class="due">0.00</div></td>
              </tr>
          </tbody>
        </table>
        
        <div id="terms">
            <h5>Terms</h5>
            <textarea>Thank you for your reservation.</textarea>
        </div>
    </div>

    <!-- NEW: Invoice History Modal -->
    <div id="historyModal" class="modal no-print">
      <div class="modal-content">
        <span class="close-button">&times;</span>
        <h2>Invoice History</h2>
        <ul id="invoice-list">
          <!-- History will be populated here by JavaScript -->
        </ul>
      </div>
    </div>

    <!-- Embedded JavaScript -->
    <script>
        // --- Helper Functions ---
        function print_today() {
            var now = new Date();
            var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            var date = ((now.getDate()<10) ? "0" : "")+ now.getDate();
            function fourdigits(number) { return (number < 1000) ? number + 1900 : number; }
            return months[now.getMonth()] + " " + date + ", " + (fourdigits(now.getYear()));
        }

        function roundNumber(number, decimals) {
            var newString;
            decimals = Number(decimals);
            if (decimals < 1) {
                newString = (Math.round(number)).toString();
            } else {
                var numString = number.toString();
                if (numString.lastIndexOf(".") == -1) { numString += "."; }
                var cutoff = numString.lastIndexOf(".") + decimals;
                var d1 = Number(numString.substring(cutoff,cutoff+1));
                var d2 = Number(numString.substring(cutoff+1,cutoff+2));
                if (d2 >= 5) {
                    if (d1 == 9 && cutoff > 0) {
                        while (cutoff > 0 && (d1 == 9 || isNaN(d1))) {
                            if (d1 != ".") { cutoff -= 1; d1 = Number(numString.substring(cutoff,cutoff+1)); }
                            else { cutoff -= 1; }
                        }
                    }
                    d1 += 1;
                }
                if (d1 == 10) {
                    numString = numString.substring(0, numString.lastIndexOf("."));
                    var roundedNum = Number(numString) + 1;
                    newString = roundedNum.toString() + '.';
                } else {
                    newString = numString.substring(0,cutoff) + d1.toString();
                }
            }
            if (newString.lastIndexOf(".") == -1) { newString += "."; }
            var decs = (newString.substring(newString.lastIndexOf(".")+1)).length;
            for(var i=0;i<decimals-decs;i++) newString += "0";
            return newString;
        }

        // --- Core Invoice Logic ---
        function update_price(row) {
            var cost = parseFloat(row.find('.cost').val().replace(/[^0-9.-]+/g,"")) || 0;
            var qty = parseFloat(row.find('.qty').val().replace(/[^0-9.-]+/g,"")) || 0;
            var price = cost * qty;
            row.find('.price').html(roundNumber(price, 2));
            update_total();
        }

        function update_total() {
            var total = 0;
            $('.price').each(function(){
                var price = parseFloat($(this).html().replace(/[^0-9.-]+/g,"")) || 0;
                total += price;
            });
            total = roundNumber(total, 2);
            $('#subtotal').html(total);
            $('#total').html(total);
            update_balance();
        }

        function update_balance() {
            var total = parseFloat($("#total").html().replace(/[^0-9.-]+/g,"")) || 0;
            var paid = parseFloat($("#paid").val().replace(/[^0-9.-]+/g,"")) || 0;
            var due = total - paid;
            if (due < 0) due = 0;
            $('.due').html(roundNumber(due, 2));
        }

        function updateDescriptionText(row) {
            var checkin = row.find(".checkin").val();
            var checkout = row.find(".checkout").val();
            var descArea = row.find(".description-area");
            var datePickers = row.find(".date-pickers");

            if (checkin && checkout) {
                var d1 = new Date(checkin);
                var d2 = new Date(checkout);
                var options = { year: 'numeric', month: 'long', day: 'numeric' };
                descArea.text(d1.toLocaleDateString('en-US', options) + " - " + d2.toLocaleDateString('en-US', options));
                
                datePickers.hide();
                descArea.addClass('editable');
            } else {
                descArea.text("Select dates below");
                datePickers.show();
                descArea.removeClass('editable');
            }
        }

        function calculateDifference(row) {
            var checkinInput = row.find(".checkin").val();
            var checkoutInput = row.find(".checkout").val();
            if (checkinInput && checkoutInput) {
                var checkInDate = new Date(checkinInput);
                var checkOutDate = new Date(checkoutInput);
                if (checkOutDate > checkInDate) {
                    var timeDiff = checkOutDate.getTime() - checkInDate.getTime();
                    var dayDiff = Math.ceil(timeDiff / (1000 * 3600 * 24));
                    row.find(".qty").val(dayDiff);
                } else {
                    row.find(".qty").val(0);
                }
            }
            updateDescriptionText(row);
            update_price(row);
        }

        function updateOrderNumbers() {
            $('#items tbody tr.item-row').each(function(i) {
                $(this).find('.order-number').text(i + 1 + ". ");
            });
        }

        function bindEvents(context) {
            context.find(".cost, .qty, .checkin, .checkout").off('blur').on('blur', function() {
                var row = $(this).closest('.item-row');
                calculateDifference(row);
            });
        }

        // --- Database Interaction Functions ---
        function saveInvoices() {
            var invoiceData = {
                title: $("#customer-title").val(),
                address: $("#address").val(),
                date: $("#date").val(),
                items: [],
                subtotal: $("#subtotal").text(),
                total: $("#total").text(),
                amountPaid: $("#paid").val(),
                balanceDue: $(".due").first().text()
            };

            $(".item-row").each(function() {
                var item = {
                    order: $(this).find('.item-name textarea').val(),
                    checkIn: $(this).find('.checkin').val(),
                    checkOut: $(this).find('.checkout').val(),
                    unitCost: $(this).find('.cost').val(),
                    qty: $(this).find('.qty').val(),
                    price: $(this).find('.price').text()
                };
                invoiceData.items.push(item);
            });

            fetch('http://localhost:3000/api/invoices', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(invoiceData),
            })
            .then(response => response.json())
            .then(data => {
                alert(`${data.message}\nYour Invoice ID is: ${data.invoiceId}`);
            })
            .catch(error => {
                alert('Failed to save invoice. Is the backend server running?');
            });
        }

        function loadInvoiceWithPrompt() {
            const invoiceId = prompt("Please enter the Invoice ID to load:");
            if (invoiceId) {
                loadInvoiceById(invoiceId);
            }
        }
        
        function loadInvoiceById(invoiceId) {
            fetch(`http://localhost:3000/api/invoices/${invoiceId}`)
            .then(response => {
                if (!response.ok) throw new Error('Invoice not found or server error.');
                return response.json();
            })
            .then(invoiceData => {
                $("#customer-title").val(invoiceData.title);
                $("#address").val(invoiceData.address);
                $("#date").val(invoiceData.date);
                $("#subtotal").text(invoiceData.subtotal);
                $("#total").text(invoiceData.total);
                $("#paid").val(invoiceData.amountPaid);
                $(".due").text(invoiceData.balanceDue);

                $('.item-row').remove();
                invoiceData.items.forEach(item => {
                    var newRow = createNewItemRow(item);
                    $('#hiderow').before(newRow);
                });
                
                bindEvents($('body'));
                updateOrderNumbers();
                update_total();
                $('#historyModal').hide();
            })
            .catch(error => {
                alert(error.message);
            });
        }
        
        function getRoomDetails(roomType) {
            let price = 0, orderText = '';
            switch(roomType) {
                case "standard": price = 250000; orderText = 'Standard Room'; break;
                case "standard_extrabed": price = 300000; orderText = 'Standard Room + Extra Bed'; break;
                case "deluxe": price = 300000; orderText = 'Deluxe Room'; break;
                case "deluxe_extrabed": price = 350000; orderText = 'Deluxe Room + Extra Bed'; break;
            }
            return { orderText, price };
        }

        function createNewItemRow(item) {
            const rowHTML = `
              <tr class="item-row">
                  <td class="item-name"><div class="delete-wpr"><span class="order-number"></span><textarea>${item.order}</textarea><a class="delete" href="javascript:;" title="Remove row">X</a></div></td>
                  <td class="description">
                      <div class="description-area"></div>
                      <div class="date-pickers">
                          <input type="date" class="checkin" value="${item.checkIn || ''}" style="width: 48%;">
                          <input type="date" class="checkout" value="${item.checkOut || ''}" style="width: 48%;">
                      </div>
                  </td>
                  <td class="text-right"><textarea class="cost">${item.unitCost}</textarea></td>
                  <td class="text-right"><textarea class="qty">${item.qty}</textarea></td>
                  <td class="text-right"><span class="price">${item.price}</span></td>
              </tr>`;
            var row = $(rowHTML);
            calculateDifference(row); // Calculate initial values
            return row;
        }

        // --- History Modal Functions ---
        function showHistory() {
            fetch('http://localhost:3000/api/invoices')
                .then(response => response.json())
                .then(invoices => {
                    const list = $('#invoice-list');
                    list.empty(); 
                    if (invoices.length === 0) {
                        list.append('<li>No saved invoices found.</li>');
                    } else {
                        invoices.forEach(invoice => {
                            const listItem = `
                                <li data-id="${invoice.id}">
                                    <span class="customer">${invoice.customer || 'No Title'}</span>
                                    <span>Date: ${invoice.date}</span>
                                    <span>Total: ${invoice.total}</span>
                                </li>`;
                            list.append(listItem);
                        });
                    }
                    $('#historyModal').show();
                })
                .catch(error => {
                    console.error('Error fetching history:', error);
                    alert('Could not fetch invoice history.');
                });
        }

        // --- Page Initialization ---
        $(document).ready(function() {
            if (sessionStorage.getItem('loggedIn') !== 'true') {
                // window.location.href = 'login.html'; // Disabled for easy testing
                // return;
            }

            bindEvents($('body'));
            
            $("#paid").on('blur', update_balance);
            
            $("#addrow").on('click', function() {
                const roomType = $('#roomType').val();
                const { orderText, price } = getRoomDetails(roomType);
                const newItem = { order: orderText, unitCost: price, qty: 1, price: roundNumber(price, 2) };
                var newRow = createNewItemRow(newItem);
                $('#hiderow').before(newRow);
                bindEvents(newRow);
                updateOrderNumbers();
                update_total();
            });
            
            $('#items').on('click', '.delete', function() {
                $(this).closest('.item-row').remove();
                updateOrderNumbers();
                update_total();
            });
            
            // NEW: Click handler to edit dates
            $('#items').on('click', '.description-area.editable', function() {
                var row = $(this).closest('.item-row');
                row.find('.date-pickers').show();
                $(this).removeClass('editable');
            });

            $("#cancel-logo, #save-logo, #change-logo, #delete-logo").click(function(){
                if (this.id === "change-logo") { $("#logo").addClass('edit'); $("#imageloc").val($("#image").attr('src')); $("#image").select(); }
                else if (this.id === "save-logo") { $("#image").attr('src', $("#imageloc").val()); $("#logo").removeClass('edit'); }
                else if (this.id === "delete-logo") { $("#logo").remove(); }
                else { $("#logo").removeClass('edit'); }
            });

            // Modal event listeners
            $('.close-button').on('click', function() { $('#historyModal').hide(); });
            $(window).on('click', function(event) { if (event.target == document.getElementById('historyModal')) { $('#historyModal').hide(); } });
            $('#invoice-list').on('click', 'li', function() {
                const id = $(this).data('id');
                if (id) { loadInvoiceById(id); }
            });

            $("#date").val(print_today());
            updateOrderNumbers();
            update_total();
        });

    </script>
</body>
</html>
